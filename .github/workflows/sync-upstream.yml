name: Sync Upstream from storytold/artcraft

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Enable manual trigger from GitHub UI

jobs:
  sync:
    name: Sync Master with Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/storytold/artcraft.git || true
          git fetch upstream master

      - name: Merge Upstream Changes
        run: |
          git merge upstream/master --no-edit || (echo "Merge conflict detected during auto-sync. Manual intervention required." && exit 1)

      - name: Push Synced Commits
        run: |
          git push origin master
