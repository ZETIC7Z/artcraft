<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <!-- Metallic Crimson Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D61" />
      <stop offset="35%" stop-color="#E50914" />
      <stop offset="70%" stop-color="#A30010" />
      <stop offset="100%" stop-color="#4D0008" />
    </linearGradient>

    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#E50914" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Emblem (Winged ZETICUZ Crest) -->
  <g transform="translate(10, 15) scale(0.85)" filter="url(#logoShadow)">
    <!-- Left Wing -->
    <path d="M 50 40 L 115 90 L 115 130 L 70 90 L 70 145 L 130 190 L 150 180 L 150 220 L 40 130 Z" fill="url(#wingGrad)" />
    <path d="M 50 40 L 115 90 L 105 95 L 55 50 Z" fill="url(#bevelLight)" />

    <!-- Right Wing -->
    <path d="M 230 40 L 165 90 L 165 130 L 210 90 L 210 145 L 150 190 L 130 180 L 130 220 L 240 130 Z" fill="url(#wingGrad)" />
    <path d="M 230 40 L 165 90 L 175 95 L 225 50 Z" fill="url(#bevelLight)" />

    <!-- Central Z -->
    <polygon points="115,50 165,50 165,72 135,115 165,115 165,138 115,138 115,116 145,72 115,72" fill="url(#wingGrad)" />
  </g>

  <!-- Brand Typography -->
  <g filter="url(#logoShadow)">
    <!-- Main Title: ZETICA -->
    <text x="240" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="115" font-weight="900" letter-spacing="4" fill="#FFFFFF" stroke="#E50914" stroke-width="2.5">ZETICA</text>

    <!-- Subtitle: CREATIVE SUITE -->
    <text x="245" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="12" fill="#E50914">CREATIVE SUITE</text>

    <!-- Developer Tagline: BY ZETICUZ -->
    <text x="246" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#888E9E">BY SAM PANGILINAN · ZETICUZ.XYZ</text>
  </g>
</svg>
