<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E26" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="40%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#550009" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D61" />
      <stop offset="40%" stop-color="#E50914" />
      <stop offset="80%" stop-color="#A30010" />
      <stop offset="100%" stop-color="#4D0008" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#E50914" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="#E50914" opacity="0.12" />

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#bgPlate)" stroke="url(#rimGlow)" stroke-width="5" filter="url(#shadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Motion FX Glyph: Speed Trails + Orbital Playhead -->
  <g id="MotionFXGlyph" filter="url(#shadow)">
    <!-- Motion trails -->
    <rect x="100" y="200" width="80" height="16" rx="8" fill="url(#crimsonGrad)" opacity="0.8" />
    <rect x="70" y="248" width="120" height="16" rx="8" fill="url(#crimsonGrad)" />
    <rect x="120" y="296" width="60" height="16" rx="8" fill="url(#crimsonGrad)" opacity="0.8" />

    <!-- Outer Speed Ring -->
    <circle cx="290" cy="256" r="105" fill="none" stroke="url(#crimsonGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="520 120" />

    <!-- Central Angular Play Arrow -->
    <polygon points="260,195 350,256 260,317" fill="url(#crimsonGrad)" />
  </g>
</svg>
