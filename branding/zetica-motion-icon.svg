<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Titanium Chassis -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211F2D" />
      <stop offset="50%" stop-color="#14131C" />
      <stop offset="100%" stop-color="#09080E" />
    </linearGradient>

    <!-- Ultraviolet Ambient Rim -->
    <linearGradient id="violetRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Motion Curve Radiant Violet Gradient -->
    <linearGradient id="motionGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="85%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#A855F7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="256" cy="256" r="200" fill="#9333EA" opacity="0.18" />

  <!-- Base Squircle Plate -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#chassisGrad)" stroke="url(#violetRim)" stroke-width="6" filter="url(#glowShadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Motion Graphics Swirl & Kinetic Particle Trail -->
  <g id="ZeticaMotionGlyph" filter="url(#glowShadow)">
    <!-- Dynamic Comet Arc -->
    <path d="M 145 320 C 170 335, 220 340, 275 300 C 330 260, 360 190, 375 145 C 345 190, 290 260, 210 270 C 170 275, 140 260, 155 240 C 170 220, 230 200, 290 215 C 325 225, 345 245, 350 255 C 340 235, 305 185, 230 180 C 160 175, 130 220, 145 320 Z" fill="url(#motionGlow)" />

    <!-- Kinetic Speed Streamer Above -->
    <path d="M 150 160 C 190 145, 250 150, 275 165 C 240 160, 185 160, 150 160 Z" fill="#E879F9" opacity="0.9" />

    <!-- Star Burst Particle Points -->
    <polygon points="380,140 384,152 396,156 384,160 380,172 376,160 364,156 376,152" fill="#FFFFFF" />
    <circle cx="340" cy="180" r="4" fill="#F472B6" />
    <circle cx="170" cy="290" r="5" fill="#E879F9" />
  </g>

  <!-- Bottom Brand Text Label Frame -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#C084FC" text-anchor="middle">ZETICA MOTION</text>
</svg>
