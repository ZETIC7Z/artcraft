<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E26" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Crimson Outer Rim Gradient -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="40%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#550009" />
    </linearGradient>

    <!-- Metallic Crimson Wing Gradient -->
    <linearGradient id="wingGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D61" />
      <stop offset="35%" stop-color="#E50914" />
      <stop offset="70%" stop-color="#A30010" />
      <stop offset="100%" stop-color="#4D0008" />
    </linearGradient>

    <linearGradient id="wingGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D61" />
      <stop offset="35%" stop-color="#E50914" />
      <stop offset="70%" stop-color="#A30010" />
      <stop offset="100%" stop-color="#4D0008" />
    </linearGradient>

    <!-- Bevel Highlights -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#E50914" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="210" fill="#E50914" opacity="0.15" filter="blur(30px)" />

  <!-- Base Squircle Container -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#bgPlate)" stroke="url(#rimGlow)" stroke-width="5" filter="url(#shadow)" />

  <!-- Inner Subtle Border Accent -->
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- ZETICUZ Winged Crest Emblem -->
  <g id="ZeticuzWings" filter="url(#shadow)">
    <!-- Left Cyber Wing -->
    <path d="M 120 180 L 195 240 L 195 285 L 140 240 L 140 295 L 210 350 L 235 340 L 235 385 L 110 280 Z" fill="url(#wingGradLeft)" />
    <!-- Left Wing Bevel Highlight -->
    <path d="M 120 180 L 195 240 L 180 245 L 125 190 Z" fill="url(#bevelLight)" />

    <!-- Right Cyber Wing -->
    <path d="M 392 180 L 317 240 L 317 285 L 372 240 L 372 295 L 302 350 L 277 340 L 277 385 L 402 280 Z" fill="url(#wingGradRight)" />
    <!-- Right Wing Bevel Highlight -->
    <path d="M 392 180 L 317 240 L 332 245 L 387 190 Z" fill="url(#bevelLight)" />

    <!-- Central Angular "Z" Core -->
    <polygon points="215,190 297,190 297,222 250,285 297,285 297,322 215,322 215,290 262,227 215,227" fill="url(#wingGradLeft)" />
    <!-- "Z" Bevel Trim -->
    <polygon points="215,190 297,190 290,198 225,198" fill="url(#bevelLight)" />
  </g>

  <!-- Specular Rim Glint -->
  <ellipse cx="256" cy="50" rx="140" ry="10" fill="url(#bevelLight)" opacity="0.4" />
</svg>
