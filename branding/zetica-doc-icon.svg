<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281A1C" />
      <stop offset="50%" stop-color="#190E10" />
      <stop offset="100%" stop-color="#0E0507" />
    </linearGradient>
    <linearGradient id="docRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="80%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#EF4444" flood-opacity="0.45" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="200" fill="#EF4444" opacity="0.18" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#chassisGrad)" stroke="url(#docRim)" stroke-width="6" filter="url(#glowShadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Document & Cryptographic Seal Glyph -->
  <g id="ZeticaDocGlyph" filter="url(#glowShadow)">
    <!-- Document Page Outline with Folded Corner -->
    <path d="M 160 130 L 300 130 L 355 185 L 355 350 C 355 365, 345 375, 330 375 L 160 375 C 145 375, 135 365, 135 350 L 135 155 C 135 140, 145 130, 160 130 Z" fill="none" stroke="url(#docGrad)" stroke-width="14" stroke-linejoin="round" />
    <!-- Corner Fold -->
    <path d="M 300 130 L 300 185 L 355 185" fill="none" stroke="url(#docGrad)" stroke-width="12" stroke-linejoin="round" />

    <!-- Text Lines -->
    <line x1="175" y1="215" x2="270" y2="215" stroke="url(#docGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="175" y1="250" x2="315" y2="250" stroke="url(#docGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="175" y1="285" x2="230" y2="285" stroke="url(#docGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- Rosette / Verified Seal in Bottom Right Corner -->
    <circle cx="295" cy="315" r="32" fill="url(#docGrad)" />
    <!-- Checkmark Inside Seal -->
    <path d="M 284 315 L 292 323 L 308 305" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Ribbon Tails -->
    <polygon points="282,342 275,370 292,360 300,345" fill="url(#docGrad)" />
    <polygon points="308,342 315,370 298,360 290,345" fill="url(#docGrad)" />
  </g>

  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#F87171" text-anchor="middle">ZETICA DOC</text>
</svg>
