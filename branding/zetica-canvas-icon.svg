<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E26" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="40%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#550009" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D61" />
      <stop offset="40%" stop-color="#E50914" />
      <stop offset="80%" stop-color="#A30010" />
      <stop offset="100%" stop-color="#4D0008" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#E50914" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#bgPlate)" stroke="url(#rimGlow)" stroke-width="5" filter="url(#shadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Photo / Canvas Aperture Glyph -->
  <g id="PhotoCanvasGlyph" filter="url(#shadow)">
    <!-- Camera Frame Outline -->
    <path d="M 120 180 L 170 140 L 220 140 L 235 160 L 370 160 C 390 160, 400 170, 400 190 L 400 350 C 400 370, 390 380, 370 380 L 140 380 C 120 380, 110 370, 110 350 L 110 190 C 110 170, 120 180, 120 180 Z" fill="none" stroke="url(#crimsonGrad)" stroke-width="16" stroke-linejoin="round" />

    <!-- Aperture Lens Core -->
    <circle cx="260" cy="270" r="65" fill="none" stroke="url(#crimsonGrad)" stroke-width="16" />
    <!-- Aperture Blades -->
    <line x1="260" y1="205" x2="295" y2="245" stroke="url(#crimsonGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="325" y1="270" x2="285" y2="305" stroke="url(#crimsonGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="260" y1="335" x2="225" y2="295" stroke="url(#crimsonGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="195" y1="270" x2="235" y2="235" stroke="url(#crimsonGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- Sparkle Flare -->
    <polygon points="370,180 375,195 390,200 375,205 370,220 365,205 350,200 365,195" fill="url(#crimsonGrad)" />
  </g>
</svg>
