<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Titanium Chassis -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B232E" />
      <stop offset="50%" stop-color="#101720" />
      <stop offset="100%" stop-color="#080D14" />
    </linearGradient>

    <!-- Cerulean Blue Ambient Rim -->
    <linearGradient id="azureRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="80%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <!-- Aperture Blade Cyan-Blue Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="200" fill="#0284C7" opacity="0.18" />

  <!-- Base Squircle Plate -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#chassisGrad)" stroke="url(#azureRim)" stroke-width="6" filter="url(#glowShadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Zetica Canvas Aperture Glyph -->
  <g id="ZeticaCanvasGlyph" filter="url(#glowShadow)">
    <!-- Outer Viewfinder Calibration Corners -->
    <path d="M 120 160 L 120 120 L 160 120" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 392 160 L 392 120 L 352 120" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 120 320 L 120 360 L 160 360" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 392 320 L 392 360 L 352 360" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Circular Aperture Housing -->
    <circle cx="256" cy="240" r="110" fill="none" stroke="url(#azureRim)" stroke-width="16" />

    <!-- 6 Interlocking High-Tech Iris Blades -->
    <path d="M 256 145 L 295 195 L 235 205 Z" fill="url(#bladeGrad)" stroke="#101720" stroke-width="3" />
    <path d="M 338 190 L 332 250 L 278 225 Z" fill="url(#bladeGrad)" stroke="#101720" stroke-width="3" />
    <path d="M 338 290 L 285 315 L 280 255 Z" fill="url(#bladeGrad)" stroke="#101720" stroke-width="3" />
    <path d="M 256 335 L 217 285 L 277 275 Z" fill="url(#bladeGrad)" stroke="#101720" stroke-width="3" />
    <path d="M 174 290 L 180 230 L 234 255 Z" fill="url(#bladeGrad)" stroke="#101720" stroke-width="3" />
    <path d="M 174 190 L 227 165 L 232 225 Z" fill="url(#bladeGrad)" stroke="#101720" stroke-width="3" />

    <!-- Center Light Focus -->
    <circle cx="256" cy="240" r="18" fill="#E0F2FE" />
  </g>

  <!-- Bottom Brand Text Label Frame -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#38BDF8" text-anchor="middle">ZETICA CANVAS</text>
</svg>
