<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281A1D" />
      <stop offset="50%" stop-color="#190F12" />
      <stop offset="100%" stop-color="#0E0608" />
    </linearGradient>
    <linearGradient id="frameRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="40%" stop-color="#F43F5E" />
      <stop offset="80%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="40%" stop-color="#FB7185" />
      <stop offset="80%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#F43F5E" flood-opacity="0.45" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="200" fill="#F43F5E" opacity="0.18" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#chassisGrad)" stroke="url(#frameRim)" stroke-width="6" filter="url(#glowShadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- UI / Frame Prototyping Layout Glyph -->
  <g id="ZeticaFrameGlyph" filter="url(#glowShadow)">
    <!-- Outer Viewport Frame -->
    <rect x="120" y="140" width="272" height="200" rx="18" fill="none" stroke="url(#uiGrad)" stroke-width="14" />
    <!-- Browser Top Bar Line -->
    <line x1="120" y1="185" x2="392" y2="185" stroke="url(#uiGrad)" stroke-width="8" />
    <circle cx="150" cy="162" r="6" fill="#FDA4AF" />
    <circle cx="170" cy="162" r="6" fill="#FDA4AF" />
    <circle cx="190" cy="162" r="6" fill="#FDA4AF" />

    <!-- Left Component Card -->
    <rect x="145" y="210" width="105" height="105" rx="10" fill="none" stroke="url(#uiGrad)" stroke-width="8" />
    <line x1="145" y1="210" x2="250" y2="315" stroke="url(#uiGrad)" stroke-width="4" opacity="0.6" />
    <line x1="250" y1="210" x2="145" y2="315" stroke="url(#uiGrad)" stroke-width="4" opacity="0.6" />

    <!-- Right Hierarchy Content Bars -->
    <rect x="270" y="215" width="105" height="16" rx="6" fill="url(#uiGrad)" />
    <rect x="270" y="245" width="85" height="12" rx="4" fill="url(#uiGrad)" opacity="0.8" />
    <rect x="270" y="270" width="100" height="35" rx="8" fill="none" stroke="url(#uiGrad)" stroke-width="6" />
  </g>

  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#FB7185" text-anchor="middle">ZETICA FRAME</text>
</svg>
