<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142820" />
      <stop offset="50%" stop-color="#0B1A14" />
      <stop offset="100%" stop-color="#050E0A" />
    </linearGradient>
    <linearGradient id="waveRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#10B981" flood-opacity="0.45" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="200" fill="#10B981" opacity="0.18" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#chassisGrad)" stroke="url(#waveRim)" stroke-width="6" filter="url(#glowShadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Audio Waveform Spectrum Glyph -->
  <g id="ZeticaWaveGlyph" filter="url(#glowShadow)">
    <rect x="130" y="220" width="14" height="40" rx="7" fill="url(#waveGrad)" />
    <rect x="155" y="195" width="14" height="90" rx="7" fill="url(#waveGrad)" />
    <rect x="180" y="160" width="14" height="160" rx="7" fill="url(#waveGrad)" />
    <rect x="205" y="180" width="14" height="120" rx="7" fill="url(#waveGrad)" />
    <rect x="230" y="140" width="14" height="200" rx="7" fill="url(#waveGrad)" />
    <rect x="256" y="120" width="14" height="240" rx="7" fill="url(#waveGrad)" />
    <rect x="282" y="150" width="14" height="180" rx="7" fill="url(#waveGrad)" />
    <rect x="307" y="185" width="14" height="110" rx="7" fill="url(#waveGrad)" />
    <rect x="332" y="165" width="14" height="150" rx="7" fill="url(#waveGrad)" />
    <rect x="357" y="200" width="14" height="80" rx="7" fill="url(#waveGrad)" />
    <rect x="382" y="225" width="14" height="30" rx="7" fill="url(#waveGrad)" />

    <!-- Equalizer Baseline Dash -->
    <line x1="120" y1="380" x2="400" y2="380" stroke="#6EE7B7" stroke-width="4" stroke-dasharray="10 8" opacity="0.6" />
  </g>

  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#34D399" text-anchor="middle">ZETICA WAVE</text>
</svg>
