<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Titanium Chassis -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E16" />
      <stop offset="50%" stop-color="#19130D" />
      <stop offset="100%" stop-color="#0E0A06" />
    </linearGradient>

    <!-- Amber Gold Ambient Rim -->
    <linearGradient id="amberRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Pen Nib Radiant Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="200" fill="#F59E0B" opacity="0.18" />

  <!-- Base Squircle Plate -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#chassisGrad)" stroke="url(#amberRim)" stroke-width="6" filter="url(#glowShadow)" />
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Zetica Vector Pen & Bézier Curve Glyph -->
  <g id="ZeticaVectorGlyph" filter="url(#glowShadow)">
    <!-- Smooth Bézier Arch Curve -->
    <path d="M 125 210 Q 256 120, 387 210" fill="none" stroke="url(#amberRim)" stroke-width="14" stroke-linecap="round" />

    <!-- Control Nodes & Handles -->
    <circle cx="125" cy="210" r="14" fill="#FCD34D" stroke="#78350F" stroke-width="4" />
    <circle cx="256" cy="140" r="14" fill="#FCD34D" stroke="#78350F" stroke-width="4" />
    <circle cx="387" cy="210" r="14" fill="#FCD34D" stroke="#78350F" stroke-width="4" />

    <!-- Handle Tangent Bars -->
    <line x1="200" y1="140" x2="312" y2="140" stroke="#FCD34D" stroke-width="6" stroke-dasharray="8 6" />
    <rect x="194" y="134" width="12" height="12" fill="#FBBF24" />
    <rect x="306" y="134" width="12" height="12" fill="#FBBF24" />

    <!-- Pen Nib Head -->
    <path d="M 256 160 L 295 240 L 280 320 L 232 320 L 217 240 Z" fill="url(#amberGrad)" />
    <!-- Pen Nib Center Slit & Eyelet -->
    <line x1="256" y1="160" x2="256" y2="255" stroke="#78350F" stroke-width="6" />
    <circle cx="256" cy="260" r="8" fill="#78350F" />
  </g>

  <!-- Bottom Brand Text Label Frame -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#FBBF24" text-anchor="middle">ZETICA VECTOR</text>
</svg>
